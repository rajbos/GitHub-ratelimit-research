name: Check GitHub Rate Limit

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-ratelimit:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Validate PAT
        id: validate-pat
        run: |
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "::error::The PAT secret is not configured. Please set the PAT secret in repository settings."
            ISSUE_TITLE="⚠️ Rate limit monitor: PAT secret is missing or expired"
            EXISTING=$(curl -s \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/search/issues?q=repo:${{ github.repository }}+is:issue+is:open+%22PAT+secret+is+missing+or+expired%22+in:title" | \
              jq -r '.total_count // 0')
            if [ "$EXISTING" = "0" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/${{ github.repository }}/issues \
                -d "{\"title\":\"$ISSUE_TITLE\",\"body\":\"The \`PAT\` secret required by the rate limit monitoring workflow is **not configured**.\n\nPlease [add the PAT secret](https://github.com/${{ github.repository }}/settings/secrets/actions) to restore monitoring.\"}" || true
            fi
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::The PAT secret is invalid or expired (HTTP $HTTP_STATUS). Please renew it in repository settings."
            ISSUE_TITLE="⚠️ Rate limit monitor: PAT secret is missing or expired"
            EXISTING=$(curl -s \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/search/issues?q=repo:${{ github.repository }}+is:issue+is:open+%22PAT+secret+is+missing+or+expired%22+in:title" | \
              jq -r '.total_count // 0')
            if [ "$EXISTING" = "0" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/${{ github.repository }}/issues \
                -d "{\"title\":\"$ISSUE_TITLE\",\"body\":\"The \`PAT\` secret required by the rate limit monitoring workflow is **expired or invalid** (HTTP $HTTP_STATUS).\n\nPlease [update the PAT secret](https://github.com/${{ github.repository }}/settings/secrets/actions) to restore monitoring.\"}" || true
            fi
            exit 1
          fi
          echo "PAT is valid."

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Fetch rate limit data
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit > /tmp/ratelimit.json
          echo "Rate limit fetched:"
          cat /tmp/ratelimit.json

      - name: Create issue on low rate limit
        run: |
          CORE_REMAINING=$(jq -r '.resources.core.remaining' /tmp/ratelimit.json)
          echo "Core remaining: ${CORE_REMAINING}"
          if ! [[ "${CORE_REMAINING}" =~ ^[0-9]+$ ]]; then
            echo "Could not read a valid CORE_REMAINING value (got: '${CORE_REMAINING}'). Skipping issue creation."
            exit 0
          fi
          if [ "${CORE_REMAINING}" -lt 1000 ]; then
            echo "Rate limit is low (${CORE_REMAINING} remaining). Creating an issue."
            ISSUE_BODY=$(jq -n \
              --arg title "⚠️ GitHub rate limit is low: ${CORE_REMAINING} remaining" \
              --arg body "@${{ vars.NOTIFY_USER }} The GitHub API rate limit is running low.\n\n**Core remaining:** ${CORE_REMAINING}\n\nPlease investigate to avoid disruptions." \
              '{title: $title, body: $body}')
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.PAT }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/issues \
              -d "${ISSUE_BODY}"
          else
            echo "Rate limit is sufficient (${CORE_REMAINING} remaining). No action needed."
          fi

      - name: Fetch recently active repositories
        run: |
          # Fetch user's own repos
          USER_REPOS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/repos?sort=pushed&direction=desc&per_page=20&type=owner")
          if ! echo "$USER_REPOS" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "Raw user repos response: $USER_REPOS"
            USER_REPOS_ERROR=$(echo "$USER_REPOS" | jq -r '.message // "unknown error"' 2>/dev/null || echo "invalid JSON")
            echo "User repos API returned non-array response (${USER_REPOS_ERROR}). Using empty array."
            echo "[]" > /tmp/repos.json
          else
            echo "$USER_REPOS" > /tmp/repos.json
          fi
          echo "Fetched $(jq length /tmp/repos.json) user-owned repos"

          # Fetch orgs the user belongs to (paginate up to 3 pages of 30)
          echo "[]" > /tmp/orgs.json
          for page in 1 2 3; do
            ORG_PAGE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.PAT }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/orgs?per_page=30&page=${page}")
            if ! echo "$ORG_PAGE" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "Raw ORG_PAGE response: $ORG_PAGE"
              ORG_ERROR=$(echo "$ORG_PAGE" | jq -r '.message // "unknown error"')
              echo "Orgs API returned non-array response on page ${page} (${ORG_ERROR}). Stopping pagination."
              break
            fi
            PAGE_COUNT=$(echo "$ORG_PAGE" | jq length)
            jq --argjson page "$ORG_PAGE" '. + $page' /tmp/orgs.json > /tmp/orgs_tmp.json
            mv /tmp/orgs_tmp.json /tmp/orgs.json
            if [ "$PAGE_COUNT" -lt 30 ]; then
              break
            fi
          done
          echo "Found $(jq length /tmp/orgs.json) orgs"

          # Fetch recently pushed repos from each org, skipping orgs with more than 150 repos
          for org in $(jq -r '.[].login' /tmp/orgs.json); do
            ORG_REPOS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.PAT }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${org}/repos?sort=pushed&direction=desc&per_page=151")
            if echo "$ORG_REPOS" | jq -e 'type == "array"' > /dev/null 2>&1; then
              ORG_REPO_COUNT=$(echo "$ORG_REPOS" | jq length)
              if [ "$ORG_REPO_COUNT" -ge 151 ]; then
                echo "Skipping org ${org}: has more than 150 repos (${ORG_REPO_COUNT}+)"
              else
                echo "$ORG_REPOS" > /tmp/org_repos_tmp.json
                jq -s '.[0] + .[1]' /tmp/repos.json /tmp/org_repos_tmp.json > /tmp/repos_tmp.json
                mv /tmp/repos_tmp.json /tmp/repos.json
              fi
            else
              ORG_ERROR=$(echo "$ORG_REPOS" | jq -r '.message // "unknown error"')
              if echo "$ORG_ERROR" | grep -qi "saml\|sso\|single sign-on\|enforcement"; then
                echo "::warning::Skipping org ${org}: SSO/SAML enforcement active - PAT needs to be authorized for this org"
              else
                echo "Raw ORG_REPOS response for org ${org}: $ORG_REPOS"
                echo "Skipping org ${org}: API returned non-array response (${ORG_ERROR})"
              fi
            fi
          done
          echo "Total repos (user + orgs): $(jq length /tmp/repos.json)"

      - name: Fetch recent workflow runs
        run: |
          SINCE=$(date -u -d '20 minutes ago' +"%Y-%m-%dT%H:%M:%SZ")
          # Collect runs from the most recently pushed repos
          echo "[]" > /tmp/runs.json
          for repo in $(jq -r 'sort_by(.pushed_at) | reverse | .[0:20][].full_name' /tmp/repos.json); do
            RAW_RUNS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.PAT }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/actions/runs?created=>=${SINCE}&per_page=10")
            if ! echo "$RAW_RUNS" | jq -e 'type == "object"' > /dev/null 2>&1; then
              echo "Raw runs response for ${repo}: $RAW_RUNS"
              echo "Skipping ${repo}: runs API returned unexpected response"
              continue
            fi
            RUNS=$(echo "$RAW_RUNS" | jq --arg repo "$repo" '[(.workflow_runs // [])[] | {repo: $repo, id: .id, name: .name, workflow_id: .workflow_id, status: .status, conclusion: .conclusion, created_at: .created_at, updated_at: .updated_at, html_url: .html_url, actor_login: (.actor.login // "")}]')
            jq --argjson runs "$RUNS" '. + $runs' /tmp/runs.json > /tmp/runs_tmp.json
            mv /tmp/runs_tmp.json /tmp/runs.json
          done
          echo "Collected $(jq length /tmp/runs.json) workflow runs since ${SINCE}"

      - name: Switch to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin data | grep -q 'refs/heads/data'; then
            git fetch origin data
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
            echo "# Rate Limit Data" > README.md
          fi

      - name: Store rate limit data point
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TIMESTAMP_FILE=$(date -u +"%Y-%m-%dT%H-%M-%SZ")

          mkdir -p runs

          # Create CSV header if file doesn't exist
          if [ ! -f ratelimit.csv ]; then
            echo "timestamp,core_limit,core_remaining,core_used,core_reset,search_limit,search_remaining,search_used,graphql_limit,graphql_remaining,graphql_used" > ratelimit.csv
          fi

          # Extract values using jq
          CORE_LIMIT=$(jq -r '.resources.core.limit' /tmp/ratelimit.json)
          CORE_REMAINING=$(jq -r '.resources.core.remaining' /tmp/ratelimit.json)
          CORE_USED=$(jq -r '.resources.core.used' /tmp/ratelimit.json)
          CORE_RESET=$(jq -r '.resources.core.reset' /tmp/ratelimit.json)
          SEARCH_LIMIT=$(jq -r '.resources.search.limit' /tmp/ratelimit.json)
          SEARCH_REMAINING=$(jq -r '.resources.search.remaining' /tmp/ratelimit.json)
          SEARCH_USED=$(jq -r '.resources.search.used' /tmp/ratelimit.json)
          GRAPHQL_LIMIT=$(jq -r '.resources.graphql.limit' /tmp/ratelimit.json)
          GRAPHQL_REMAINING=$(jq -r '.resources.graphql.remaining' /tmp/ratelimit.json)
          GRAPHQL_USED=$(jq -r '.resources.graphql.used' /tmp/ratelimit.json)

          # Append data point to CSV
          echo "${TIMESTAMP},${CORE_LIMIT},${CORE_REMAINING},${CORE_USED},${CORE_RESET},${SEARCH_LIMIT},${SEARCH_REMAINING},${SEARCH_USED},${GRAPHQL_LIMIT},${GRAPHQL_REMAINING},${GRAPHQL_USED}" >> ratelimit.csv

          # Store workflow runs snapshot for this time window
          cp /tmp/runs.json "runs/${TIMESTAMP_FILE}.json"

      - name: Update repos summary
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Load existing summary or start fresh
          if [ -f repos-summary.json ]; then
            cp repos-summary.json /tmp/existing-summary.json
          else
            echo '{"last_updated":"","repos":{}}' > /tmp/existing-summary.json
          fi

          # Merge new runs into repos-summary.json (public repos only, deduplicated by run ID)
          # Use --slurpfile to read large JSON files directly (avoids "Argument list too long" error)
          jq \
            --slurpfile runs /tmp/runs.json \
            --slurpfile repos /tmp/repos.json \
            --arg ts "$TIMESTAMP" '
            ([$repos[0][] | {key: .full_name, value: {html_url: .html_url, private: .private}}] | from_entries) as $repo_map |
            reduce $runs[0][] as $run (
              .;
              ($repo_map[$run.repo]) as $repo_info |
              (($run.actor_login == "dependabot[bot]") or (($run.name | ascii_downcase) == "codeql")) as $is_automated_run |
              if $repo_info != null and ($repo_info.private == false) and ($is_automated_run | not) then
                .repos[$run.repo] //= {full_name: $run.repo, html_url: $repo_info.html_url, run_count: 0, total_minutes: 0, seen_run_ids: []} |
                if (.repos[$run.repo].seen_run_ids | index($run.id)) == null then
                  .repos[$run.repo].run_count += 1 |
                  .repos[$run.repo].total_minutes += (
                    (($run.updated_at | fromdateiso8601) - ($run.created_at | fromdateiso8601)) / 60 | floor
                  ) |
                  .repos[$run.repo].seen_run_ids += [$run.id]
                else . end
              else . end
            ) |
            .repos |= with_entries(.value.seen_run_ids = (.value.seen_run_ids[-200:])) |
            .last_updated = $ts
          ' /tmp/existing-summary.json > repos-summary.json

      - name: Commit and push to data branch
        run: |
          git add ratelimit.csv runs/ repos-summary.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "Add rate limit data point: ${TIMESTAMP}"
            git push origin data
          fi
