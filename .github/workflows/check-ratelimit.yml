name: Check GitHub Rate Limit

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-ratelimit:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Validate PAT
        id: validate-pat
        run: |
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "::error::The PAT secret is not configured. Please set the PAT secret in repository settings."
            ISSUE_TITLE="⚠️ Rate limit monitor: PAT secret is missing or expired"
            EXISTING=$(curl -s \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/search/issues?q=repo:${{ github.repository }}+is:issue+is:open+%22PAT+secret+is+missing+or+expired%22+in:title" | \
              jq -r '.total_count // 0')
            if [ "$EXISTING" = "0" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/${{ github.repository }}/issues \
                -d "{\"title\":\"$ISSUE_TITLE\",\"body\":\"The \`PAT\` secret required by the rate limit monitoring workflow is **not configured**.\n\nPlease [add the PAT secret](https://github.com/${{ github.repository }}/settings/secrets/actions) to restore monitoring.\"}" || true
            fi
            exit 1
          fi
          # /rate_limit is free and still answers 200 when the quota is used up, so an
          # exhausted quota is not mistaken for a bad PAT (which would lose the sample).
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::The PAT secret is invalid or expired (HTTP $HTTP_STATUS). Please renew it in repository settings."
            ISSUE_TITLE="⚠️ Rate limit monitor: PAT secret is missing or expired"
            EXISTING=$(curl -s \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/search/issues?q=repo:${{ github.repository }}+is:issue+is:open+%22PAT+secret+is+missing+or+expired%22+in:title" | \
              jq -r '.total_count // 0')
            if [ "$EXISTING" = "0" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/${{ github.repository }}/issues \
                -d "{\"title\":\"$ISSUE_TITLE\",\"body\":\"The \`PAT\` secret required by the rate limit monitoring workflow is **expired or invalid** (HTTP $HTTP_STATUS).\n\nPlease [update the PAT secret](https://github.com/${{ github.repository }}/settings/secrets/actions) to restore monitoring.\"}" || true
            fi
            exit 1
          fi
          echo "PAT is valid."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Fetch rate limit data
        run: |
          # The one clock reading for this sample: the CSV row and the snapshot filename both use it
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"
          echo "TIMESTAMP_FILE=${TIMESTAMP//:/-}" >> "$GITHUB_ENV"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit > /tmp/ratelimit.json
          echo "Rate limit fetched:"
          cat /tmp/ratelimit.json

      - name: Create or update issue on low rate limit
        run: |
          CORE_REMAINING=$(jq -r '.resources.core.remaining' /tmp/ratelimit.json)
          echo "Core remaining: ${CORE_REMAINING}"
          if ! [[ "${CORE_REMAINING}" =~ ^[0-9]+$ ]]; then
            echo "Could not read a valid CORE_REMAINING value (got: '${CORE_REMAINING}'). Skipping issue creation."
            exit 0
          fi
          if [ "${CORE_REMAINING}" -lt 1000 ]; then
            ISSUE_TITLE="⚠️ GitHub rate limit is low"
            ISSUE_TEXT=$(jq -rn \
              --arg user "${{ vars.NOTIFY_USER }}" \
              --arg remaining "${CORE_REMAINING}" \
              '"@\($user) The GitHub API rate limit is running low.\n\n**Core remaining:** \($remaining)\n\nPlease investigate to avoid disruptions."')

            # Use github.token for all issue calls: the PAT is the quota that is running out
            SEARCH_RESPONSE=$(curl -s -G \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "q=repo:${{ github.repository }} is:issue is:open in:title \"GitHub rate limit is low\"" \
              --data-urlencode "sort=created" \
              --data-urlencode "order=desc" \
              --data-urlencode "per_page=100" \
              https://api.github.com/search/issues || true)
            if ! echo "$SEARCH_RESPONSE" | jq -e '.items | type == "array"' > /dev/null 2>&1; then
              echo "Raw issue search response: $SEARCH_RESPONSE"
              echo "::warning::Could not search for an existing issue. Skipping notification to avoid a duplicate."
              exit 0
            fi

            # Match the exact title: older issues have the remaining count in their title
            EXISTING=$(echo "$SEARCH_RESPONSE" | jq -c --arg title "$ISSUE_TITLE" '[.items[] | select(.title == $title)][0] // empty')
            if [ -z "$EXISTING" ]; then
              echo "Rate limit is low (${CORE_REMAINING} remaining). Creating an issue."
              curl -s -X POST \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/${{ github.repository }}/issues \
                -d "$(jq -n --arg title "$ISSUE_TITLE" --arg body "$ISSUE_TEXT" '{title: $title, body: $body}')"
            else
              ISSUE_NUMBER=$(echo "$EXISTING" | jq -r '.number')
              ISSUE_AGE=$(( $(date -u +%s) - $(echo "$EXISTING" | jq -r '.updated_at | fromdateiso8601') ))
              # The core quota resets hourly, so one comment per hour is enough
              if [ "$ISSUE_AGE" -lt 3600 ]; then
                echo "Rate limit is low (${CORE_REMAINING} remaining). Issue #${ISSUE_NUMBER} was updated ${ISSUE_AGE}s ago, not notifying again."
              else
                echo "Rate limit is low (${CORE_REMAINING} remaining). Commenting on issue #${ISSUE_NUMBER}."
                curl -s -X POST \
                  -H "Authorization: Bearer ${{ github.token }}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments \
                  -d "$(jq -n --arg body "$ISSUE_TEXT" '{body: $body}')"
              fi
            fi
          else
            echo "Rate limit is sufficient (${CORE_REMAINING} remaining). No action needed."
          fi

      - name: Restore repo listing cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/repo-list-cache
          key: repo-list-${{ github.run_id }}
          restore-keys: repo-list-

      - name: Fetch recently active repositories
        run: |
          CACHE_DIR=/tmp/repo-list-cache
          mkdir -p "$CACHE_DIR"
          : > /tmp/lookup_errors.jsonl
          RATE_LIMITED=false
          LISTINGS_FETCHED=0
          LISTINGS_UNCHANGED=0
          REPO_FIELDS='[.[] | {full_name, html_url, private, pushed_at}]'

          # Refresh $CACHE_DIR/<key>.json with a conditional request: GitHub does not count a 304
          # against the quota. If a request fails, the last known listing is used instead.
          fetch_listing() {
            local key="$1" url="$2" fields="$3"
            local list_file="${CACHE_DIR}/${key}.json" etag_file="${CACHE_DIR}/${key}.etag"
            if [ "$RATE_LIMITED" = "true" ]; then
              if [ ! -f "$list_file" ]; then
                echo '{"scope":"repos","kind":"rate_limited","status":403}' >> /tmp/lookup_errors.jsonl
              fi
              return 0
            fi
            local etag_args=()
            if [ -s "$etag_file" ] && [ -f "$list_file" ]; then
              etag_args=(-H "If-None-Match: $(cat "$etag_file")")
            fi
            rm -f /tmp/listing_raw.json
            local status
            status=$(curl -s -D /tmp/listing_headers.txt -o /tmp/listing_raw.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.PAT }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${etag_args[@]}" \
              "$url" || true)
            if [ "$status" = "304" ]; then
              LISTINGS_UNCHANGED=$((LISTINGS_UNCHANGED + 1))
              return 0
            fi
            if [ "$status" = "200" ] && jq -e 'type == "array"' /tmp/listing_raw.json > /dev/null 2>&1; then
              LISTINGS_FETCHED=$((LISTINGS_FETCHED + 1))
              jq "$fields" /tmp/listing_raw.json > "$list_file"
              tr -d '\r' < /tmp/listing_headers.txt | sed -n 's/^[Ee][Tt][Aa][Gg]: //p' | tail -n 1 > "$etag_file"
              return 0
            fi
            local message kind=http_error
            message=$(jq -r '.message // "no message"' /tmp/listing_raw.json 2>/dev/null || echo "invalid JSON")
            if echo "$message" | grep -qi "saml\|sso\|single sign-on\|enforcement"; then
              echo "::warning::Skipping ${key}: SSO/SAML enforcement active - PAT needs to be authorized for this org"
              rm -f "$list_file" "$etag_file"
              return 0
            fi
            if echo "$message" | grep -qi "rate limit"; then
              kind=rate_limited
              RATE_LIMITED=true
            fi
            echo "Listing ${key} failed: HTTP ${status} (${message})"
            if [ ! -f "$list_file" ]; then
              jq -cn --arg kind "$kind" --argjson status "$((10#$status))" \
                '{scope: "repos", kind: $kind, status: $status}' >> /tmp/lookup_errors.jsonl
            fi
          }

          # The listings are sorted by push date, so 20 per owner is enough to find the top 20 overall
          fetch_listing user-repos "https://api.github.com/user/repos?sort=pushed&direction=desc&per_page=20&type=owner" "$REPO_FIELDS"
          fetch_listing orgs "https://api.github.com/user/orgs?per_page=100" '[.[] | {login}]'

          echo "[]" > /tmp/repos.json
          LISTINGS=(/tmp/repos.json)
          if [ -f "${CACHE_DIR}/user-repos.json" ]; then
            LISTINGS+=("${CACHE_DIR}/user-repos.json")
          fi
          ORGS=""
          if [ -f "${CACHE_DIR}/orgs.json" ]; then
            ORGS=$(jq -r '.[].login' "${CACHE_DIR}/orgs.json")
          fi
          for org in $ORGS; do
            fetch_listing "org-${org}" "https://api.github.com/orgs/${org}/repos?sort=pushed&direction=desc&per_page=20" "$REPO_FIELDS"
            if [ -f "${CACHE_DIR}/org-${org}.json" ]; then
              LISTINGS+=("${CACHE_DIR}/org-${org}.json")
            fi
          done
          jq -s 'add' "${LISTINGS[@]}" > /tmp/repos_tmp.json
          mv /tmp/repos_tmp.json /tmp/repos.json
          echo "Listings: ${LISTINGS_FETCHED} fetched, ${LISTINGS_UNCHANGED} unchanged (free)"
          echo "Total repos (user + orgs): $(jq length /tmp/repos.json)"

      - name: Save repo listing cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/repo-list-cache
          key: repo-list-${{ github.run_id }}

      - name: Fetch recent workflow runs
        run: |
          # Look back to the previous sample rather than a fixed window, because samples can be
          # far apart. Two minutes of overlap covers clock differences; run IDs dedupe the rest.
          NOW_EPOCH=$(date -u -d "$TIMESTAMP" +%s)
          SINCE_EPOCH=$((NOW_EPOCH - 20 * 60))
          PREVIOUS=$(git show origin/data:ratelimit.csv 2>/dev/null | tail -n 1 | cut -d, -f1)
          if [[ "$PREVIOUS" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z$ ]]; then
            SINCE_EPOCH=$(($(date -u -d "$PREVIOUS" +%s) - 120))
            # A previous snapshot with failed lookups never covered its own window, so cover it now
            PREVIOUS_SINCE=$(git show "origin/data:runs/${PREVIOUS//:/-}.json" 2>/dev/null | \
              jq -r 'if type == "object" and (.errors | length > 0) then .since else empty end' 2>/dev/null || true)
            if [ -n "$PREVIOUS_SINCE" ]; then
              SINCE_EPOCH=$(date -u -d "$PREVIOUS_SINCE" +%s)
            fi
          fi
          OLDEST_EPOCH=$((NOW_EPOCH - 6 * 3600))
          if [ "$SINCE_EPOCH" -lt "$OLDEST_EPOCH" ]; then
            SINCE_EPOCH=$OLDEST_EPOCH
          fi
          SINCE=$(date -u -d "@$SINCE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")

          # Collect runs from the most recently pushed repos
          echo "[]" > /tmp/runs.json
          echo "[]" > /tmp/truncated.json
          REPOS=$(jq -r 'sort_by(.pushed_at) | reverse | .[0:20][].full_name' /tmp/repos.json)
          REPOS_PLANNED=$(jq 'if length > 20 then 20 else length end' /tmp/repos.json)
          REPOS_TRIED=0
          REPOS_CHECKED=0
          for repo in $REPOS; do
            REPOS_TRIED=$((REPOS_TRIED + 1))
            rm -f /tmp/runs_raw.json
            HTTP_STATUS=$(curl -s -o /tmp/runs_raw.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.PAT }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/actions/runs?created=>=${SINCE}&per_page=100" || true)
            if [ "$HTTP_STATUS" != "200" ] || ! jq -e '.workflow_runs | type == "array"' /tmp/runs_raw.json > /dev/null 2>&1; then
              MESSAGE=$(jq -r '.message // "no message"' /tmp/runs_raw.json 2>/dev/null || echo "invalid JSON")
              echo "Runs lookup failed for ${repo}: HTTP ${HTTP_STATUS} (${MESSAGE})"
              if echo "$MESSAGE" | grep -qi "rate limit"; then
                # The remaining lookups would fail too, and retrying at the limit risks a secondary limit
                jq -cn --argjson status "$((10#$HTTP_STATUS))" --argjson count "$((REPOS_PLANNED - REPOS_TRIED + 1))" \
                  '{scope: "runs", kind: "rate_limited", status: $status, count: $count}' >> /tmp/lookup_errors.jsonl
                break
              fi
              jq -cn --argjson status "$((10#$HTTP_STATUS))" \
                '{scope: "runs", kind: "http_error", status: $status}' >> /tmp/lookup_errors.jsonl
              continue
            fi
            REPOS_CHECKED=$((REPOS_CHECKED + 1))
            jq --arg repo "$repo" '[.workflow_runs[] | {repo: $repo, id: .id, name: .name, workflow_id: .workflow_id, status: .status, conclusion: .conclusion, created_at: .created_at, updated_at: .updated_at, html_url: .html_url, actor_login: (.actor.login // "")}]' /tmp/runs_raw.json > /tmp/repo_runs.json
            jq -s '.[0] + .[1]' /tmp/runs.json /tmp/repo_runs.json > /tmp/runs_tmp.json
            mv /tmp/runs_tmp.json /tmp/runs.json
            if jq -e '(.total_count // 0) > (.workflow_runs | length)' /tmp/runs_raw.json > /dev/null; then
              jq --arg repo "$repo" '. + [$repo]' /tmp/truncated.json > /tmp/truncated_tmp.json
              mv /tmp/truncated_tmp.json /tmp/truncated.json
            fi
          done
          echo "Collected $(jq length /tmp/runs.json) workflow runs from ${REPOS_CHECKED} of ${REPOS_PLANNED} repos since ${SINCE}"

          # Stored around the runs, so a failed lookup can be told apart from a quiet period
          jq -s \
            --arg since "$SINCE" \
            --argjson repos_planned "$REPOS_PLANNED" \
            --argjson repos_checked "$REPOS_CHECKED" \
            --slurpfile truncated /tmp/truncated.json \
            'group_by([.scope, .kind, .status])
             | map(.[0] + {count: (map(.count // 1) | add)})
             | {since: $since, repos_planned: $repos_planned, repos_checked: $repos_checked, truncated: $truncated[0], errors: .}' \
            /tmp/lookup_errors.jsonl > /tmp/runs_meta.json

      - name: Switch to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin data | grep -q 'refs/heads/data'; then
            git fetch origin data
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
            echo "# Rate Limit Data" > README.md
          fi

      - name: Store rate limit data point
        run: |
          mkdir -p runs

          # Create CSV header if file doesn't exist
          if [ ! -f ratelimit.csv ]; then
            echo "timestamp,core_limit,core_remaining,core_used,core_reset,search_limit,search_remaining,search_used,graphql_limit,graphql_remaining,graphql_used" > ratelimit.csv
          fi

          # Extract values using jq
          CORE_LIMIT=$(jq -r '.resources.core.limit' /tmp/ratelimit.json)
          CORE_REMAINING=$(jq -r '.resources.core.remaining' /tmp/ratelimit.json)
          CORE_USED=$(jq -r '.resources.core.used' /tmp/ratelimit.json)
          CORE_RESET=$(jq -r '.resources.core.reset' /tmp/ratelimit.json)
          SEARCH_LIMIT=$(jq -r '.resources.search.limit' /tmp/ratelimit.json)
          SEARCH_REMAINING=$(jq -r '.resources.search.remaining' /tmp/ratelimit.json)
          SEARCH_USED=$(jq -r '.resources.search.used' /tmp/ratelimit.json)
          GRAPHQL_LIMIT=$(jq -r '.resources.graphql.limit' /tmp/ratelimit.json)
          GRAPHQL_REMAINING=$(jq -r '.resources.graphql.remaining' /tmp/ratelimit.json)
          GRAPHQL_USED=$(jq -r '.resources.graphql.used' /tmp/ratelimit.json)

          # Append data point to CSV
          echo "${TIMESTAMP},${CORE_LIMIT},${CORE_REMAINING},${CORE_USED},${CORE_RESET},${SEARCH_LIMIT},${SEARCH_REMAINING},${SEARCH_USED},${GRAPHQL_LIMIT},${GRAPHQL_REMAINING},${GRAPHQL_USED}" >> ratelimit.csv

          # Store workflow runs snapshot for this time window
          jq -s '.[0] + {runs: .[1]}' /tmp/runs_meta.json /tmp/runs.json > "runs/${TIMESTAMP_FILE}.json"

      - name: Update repos summary
        run: |
          # Load existing summary or start fresh
          if [ -f repos-summary.json ]; then
            cp repos-summary.json /tmp/existing-summary.json
          else
            echo '{"last_updated":"","repos":{}}' > /tmp/existing-summary.json
          fi

          # Merge new runs into repos-summary.json (public repos only, deduplicated by run ID)
          # Use --slurpfile to read large JSON files directly (avoids "Argument list too long" error)
          jq \
            --slurpfile runs /tmp/runs.json \
            --slurpfile repos /tmp/repos.json \
            --arg ts "$TIMESTAMP" '
            ([$repos[0][] | {key: .full_name, value: {html_url: .html_url, private: .private}}] | from_entries) as $repo_map |
            reduce $runs[0][] as $run (
              .;
              ($repo_map[$run.repo]) as $repo_info |
              (($run.actor_login == "dependabot[bot]") or (($run.name | ascii_downcase) == "codeql")) as $is_automated_run |
              if $repo_info != null and ($repo_info.private == false) and ($is_automated_run | not) then
                .repos[$run.repo] //= {full_name: $run.repo, html_url: $repo_info.html_url, run_count: 0, total_minutes: 0, seen_run_ids: []} |
                if (.repos[$run.repo].seen_run_ids | index($run.id)) == null then
                  .repos[$run.repo].run_count += 1 |
                  .repos[$run.repo].total_minutes += (
                    (($run.updated_at | fromdateiso8601) - ($run.created_at | fromdateiso8601)) / 60 | floor
                  ) |
                  .repos[$run.repo].seen_run_ids += [$run.id]
                else . end
              else . end
            ) |
            .repos |= with_entries(.value.seen_run_ids = (.value.seen_run_ids[-200:])) |
            .last_updated = $ts
          ' /tmp/existing-summary.json > repos-summary.json

      - name: Commit and push to data branch
        run: |
          git add ratelimit.csv runs/ repos-summary.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "Add rate limit data point: ${TIMESTAMP}"
            git push origin data
          fi
